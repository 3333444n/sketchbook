name: Bug report
description: Something in Sketchbook doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. If the bug also happens on [excalidraw.com](https://excalidraw.com), it's probably in the drawing engine; please report it upstream at [excalidraw/excalidraw](https://github.com/excalidraw/excalidraw/issues).
        Security issues: don't file them here. See [SECURITY.md](https://github.com/3333444n/sketchbook/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a new tab (⌘T)
        2. Draw a rectangle
        3. Press ⌘S
        4. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Sketchbook version
      description: Sketchbook → About Sketchbook
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 15.4 (Apple M2)
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Drawing / canvas
        - Open / save / files
        - Tabs / windows
        - Export (PNG / SVG)
        - Crash recovery
        - Offline / fonts
        - Install / Gatekeeper
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: DevTools console output (⌥⌘I), terminal output, or screenshots. Attach a sample `.excalidraw` file if relevant.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for this bug.
          required: true
