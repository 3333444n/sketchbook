<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Sketchbook app icon: a pencil drawing a loose loop on a sheet of paper. Original artwork. -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#f3ecd9"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffcf4a"/>
      <stop offset="0.5" stop-color="#ffb627"/>
      <stop offset="1" stop-color="#e8961a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Paper tile (macOS icon grid: 824px tile, 100px margin) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#paper)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#e2d6b8" stroke-width="6"/>

  <!-- Faint notebook rules -->
  <g stroke="#c9dcf0" stroke-width="6" stroke-linecap="round" opacity="0.8">
    <path d="M190 330 H834"/>
    <path d="M190 450 H834"/>
    <path d="M190 570 H834"/>
    <path d="M190 690 H834"/>
  </g>

  <!-- Hand-drawn loop, drawn twice with a slight offset for a sketchy feel -->
  <g fill="none" stroke="#3b4a6b" stroke-linecap="round" stroke-linejoin="round">
    <path stroke-width="26" d="M214 742 C 262 600, 330 470, 420 470 C 520 470, 512 612, 430 628 C 352 642, 360 520, 470 492 C 560 470, 620 530, 660 590"/>
    <path stroke-width="10" opacity="0.45" d="M222 752 C 270 606, 338 482, 426 480 C 530 478, 524 622, 436 638 C 344 652, 354 512, 478 482"/>
  </g>

  <!-- Pencil, tip touching the end of the loop -->
  <g transform="translate(660 590) rotate(-45) scale(0.62)">
    <!-- graphite tip -->
    <path d="M0 0 L46 -22 L46 22 Z" fill="#2c2c34"/>
    <!-- sharpened wood -->
    <path d="M30 -15 L120 -50 L120 50 L30 15 Z" fill="#f2c99a"/>
    <path d="M0 0 L46 -22 L46 22 Z" fill="#2c2c34"/>
    <!-- body -->
    <rect x="120" y="-50" width="330" height="100" fill="url(#body)"/>
    <path d="M120 -17 H450 M120 17 H450" stroke="#d98712" stroke-width="5"/>
    <!-- ferrule -->
    <rect x="450" y="-52" width="62" height="104" rx="6" fill="#b9c2cf"/>
    <path d="M468 -52 V52 M492 -52 V52" stroke="#8f9aab" stroke-width="7"/>
    <!-- eraser -->
    <path d="M512 -52 H556 A 30 30 0 0 1 586 -22 V22 A 30 30 0 0 1 556 52 H512 Z" fill="#f2777a"/>
    <!-- outline -->
    <path d="M0 0 L120 -50 H586 V50 H120 Z" fill="none" stroke="#3b4a6b" stroke-width="10" stroke-linejoin="round" opacity="0.9"/>
  </g>
</svg>
